name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The generator runs inside semantic-release's prepareCmd, after CHANGELOG
      # and gradle.properties have already been bumped. A broken generator would
      # abort the release half-way through, so exercise it before releasing.
      - name: Verify release scripts
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation and the test suites when semantic-release did
      # not publish a release. This covers non-main/dev branches, chore commits,
      # docs commits, etc. Release builds run the tests through `gradle build`.
      - name: Verify project compiles and tests pass
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean :patches:buildAndroid test :patches:generatePatchesList --no-daemon
          python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" patches-list.json README.md

      - name: Upload compiled patches
        if: steps.release.outputs.new_release_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: historical-inapp-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Upload generated patch catalog
        if: steps.release.outputs.new_release_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-patch-catalog
          path: |
            patches-list.json
            README.md
          if-no-files-found: error

      - name: Publish historical branch bundle
        if: github.ref_name == 'historical-inapp' && steps.release.outputs.new_release_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle_version=$(sed -n 's/^version *= *//p' gradle.properties)
          test -n "$bundle_version"
          bundle_path="patches/build/libs/patches-$bundle_version.mpp"
          test -f "$bundle_path"
          bundle_tag="v$bundle_version-historical"
          if ! gh release view "$bundle_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/historical-release-notes.md" <<'NOTES'
          Restored integrated Ads Free Rewards adapters, overlay controls and regression coverage.
          Includes InApp Emulation, standalone historical No Ads / Ads Free Rewards, Ads Block, Permission Guard and Universal Overlay.
          Android bundle compilation, unit tests and generated patch catalog verification passed before publication.
          NOTES
            gh release create "$bundle_tag" "$bundle_path" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "UniPatches $bundle_version — restored historical bundle" \
              --notes-file "$RUNNER_TEMP/historical-release-notes.md"
          fi
          export BUNDLE_VERSION="$bundle_version"
          python3 - <<'PY'
          import datetime, json, os
          version = os.environ["BUNDLE_VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          metadata = {
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "description": "Restored historical bundle: integrated reward adapters and overlay controls, InApp Emulation, standalone No Ads and historical Ads Free Rewards. Built and tested from this fork.",
              "download_url": f"https://github.com/{repo}/releases/download/v{version}-historical/patches-{version}.mpp",
              "signature_download_url": "",
              "version": version,
          }
          with open("patches-bundle.json", "w") as stream:
              json.dump(metadata, stream, indent=2)
              stream.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update restored bundle $bundle_version [skip ci]"
            git push origin HEAD:historical-inapp
          fi
